        .tree-header { padding: 10px 12px; background: #faf8f3; border-radius: 8px; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
        .tree-header:hover { background: #f0ebe3; border-left-color: #3a7d6a; }
        .tree-header.active { background: #3a7d6a; color: white; }
        .tree-children { display: none; margin-left: 15px; padding-left: 10px; border-left: 2px solid #e8d4a0; margin-top: 5px; }
        .tree-children.show { display: block; }
        .tree-point { padding: 8px 12px; margin: 3px 0; background: white; border-radius: 6px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; border: 1px solid #e8e4dc; }
        .tree-point:hover { background: #3a7d6a; color: white; transform: translateX(3px); }
        .tree-point.active { background: #2d5f4f; color: white; }
        .viewer-panel { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); min-height: 600px; }
        .viewer-header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e8d4a0; }
        .viewer-header h2 { font-size: 1.8em; color: #2d5f4f; margin-bottom: 8px; }
        .viewer-info { background: #faf8f3; padding: 12px 20px; border-radius: 8px; display: inline-block; border-left: 4px solid #c9a961; }
        .image-container { text-align: center; margin: 25px 0; }
        .image-display { max-width: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); border: 3px solid #e8d4a0; }
        .nav-buttons { display: flex; justify-content: center; gap: 12px; margin-top: 25px; flex-wrap: wrap; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #2d5f4f 0%, #3a7d6a 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(58, 125, 106, 0.3); }
        .btn-secondary { background: white; color: #2d5f4f; border: 2px solid #3a7d6a; }
        .btn-secondary:hover { background: #3a7d6a; color: white; }
        .placeholder { text-align: center; padding: 60px 20px; color: #8b9aa8; }

        let currentImageNum = 0;
        let currentPageNum = 0;
        
        function generateIndex() {
            const treeNav = document.getElementById('treeNav');
            let html = '';
            indexData.forEach(section => {
                html += `<div class="tree-item">`;
                html += `<div class="tree-header" onclick="toggleTree(this, event)">`;
                html += `<span>${section.title}</span>`;
                html += `<span style="font-size: 0.8em;">▼</span></div>`;
                html += `<div class="tree-children">`;
                section.children.forEach(child => {
                    if (child.points) {
                        html += `<div class="tree-header" onclick="toggleTree(this, event)" style="margin: 5px 0; font-size: 0.9em;">`;
                        html += `<span>${child.title}</span>`;
                        html += `<span style="font-size: 0.8em;">▼</span></div>`;
                        html += `<div class="tree-children">`;
                        child.points.forEach(point => {
                            const hasImage = pageToImage(point.page) !== null;
                            const clickHandler = hasImage 
                                ? `loadPage(${point.page}, this, event)` 
                                : `showNoImage(${point.page}, '${point.name}', this, event)`;
                            html += `<div class="tree-point" onclick="${clickHandler}">`;
                            html += `<span>${point.name}</span>`;
                            html += `<span style="color: #8b9aa8; font-size: 0.85em;">pág. ${point.page}</span>`;
                            html += `</div>`;
                        });
                        html += `</div>`;
                    } else {
                        const hasImage = !child.noImage;
                        const clickHandler = hasImage 
                            ? `loadPage(${child.page}, this, event)` 
                            : `showNoImage(${child.page}, '${child.title}', this, event)`;
                        html += `<div class="tree-point" onclick="${clickHandler}">`;
                        html += `<span>${child.title}</span>`;
                        html += `<span style="color: #8b9aa8; font-size: 0.85em;">pág. ${child.page}</span>`;
                        html += `</div>`;
                    }
                });
                html += `</div></div>`;
            });
            treeNav.innerHTML = html;
        }
        
        function toggleTree(element, event) {
            if (event) event.stopPropagation();
            const children = element.nextElementSibling;
            if (children && children.classList.contains('tree-children')) {
                children.classList.toggle('show');
                element.classList.toggle('active');
            }
        }
        
        function loadPage(pageNum, element, event) {
            if (event) event.stopPropagation();
            document.querySelectorAll('.tree-point').forEach(p => p.classList.remove('active'));
            if (element) element.classList.add('active');
            
            const viewerContent = document.getElementById('viewerContent');
            viewerContent.innerHTML = '<div class="loading">Cargando imagen...</div>';
            
            const imageNum = pageToImage(pageNum);
            
            if (imageNum !== null && imageNum >= 1) {
                currentPageNum = pageNum;
                currentImageNum = imageNum;
                displayImage(imageNum, pageNum, element);
            } else {
                viewerContent.innerHTML = `<div class="error">No hay imagen para página ${pageNum}</div>`;
                if (element) element.classList.remove('active');
            }
        }
        
        function showNoImage(pageNum, title, element, event) {
            if (event) event.stopPropagation();
            document.querySelectorAll('.tree-point').forEach(p => p.classList.remove('active'));
            if (element) element.classList.add('active');
            document.getElementById('viewerContent').innerHTML = `
                <div class="no-image">
                    <h2>📄 ${title}</h2>
                    <p>Página ${pageNum}</p>
                    <p style="margin-top: 20px; font-size: 0.9em;">Esta página no tiene imágenes asociadas.</p>
                </div>`;
        }
        
        function displayImage(imageNum, pageNum, element) {
            // 4 DÍGITOS: 0001, 0024, 0076, 0122, etc.
            const paddedNum = String(imageNum).padStart(4, '0');
            const imageUrl = GITHUB_BASE + paddedNum + '.jpg';
            const img = new Image();
            img.onload = function() {
                document.getElementById('viewerContent').innerHTML = `
                    <div class="viewer-header">
                        <h2>📖 Imagen del Atlas</h2>
                        <div class="viewer-info">
                            <strong>Imagen:</strong> ${paddedNum}.jpg | <strong>Página:</strong> ${pageNum}
                        </div>
                    </div>
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Página ${pageNum}" class="image-display">
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-primary" onclick="previousImage()">⬅️ Anterior</button>
                        <button class="btn btn-secondary" onclick="nextImage()">Siguiente ➡️</button>
                    </div>`;
                currentImageNum = imageNum;
                if (element) element.classList.remove('active');
            };
            img.onerror = function() {
                document.getElementById('viewerContent').innerHTML = `<div class="error">No se pudo cargar ${paddedNum}.jpg<br>Verifica que el archivo existe en GitHub</div>`;
                if (element) element.classList.remove('active');
            };
            img.src = imageUrl;
        }
        
        function previousImage() {
            if (currentImageNum > 1) { 
                currentImageNum--; 
                currentPageNum--; 
                displayImage(currentImageNum, currentPageNum, null); 
            }
        }
        function nextImage() {
            if (currentImageNum < 711) { 
                currentImageNum++; 
                currentPageNum++; 
                displayImage(currentImageNum, currentPageNum, null); 
            }
        }
        
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.tree-point').forEach(point => {
                const text = point.textContent.toLowerCase();
                point.style.display = text.includes(query) ? 'flex' : 'none';
            });
        });
        
        generateIndex();
    </script>
