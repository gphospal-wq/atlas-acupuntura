    <title>Atlas de Acupuntura - Claudia Focks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2d5f4f;
            --secondary: #3a7d6a;
            --accent: #c9a961;
            --bg: #faf8f3;
            --surface: #ffffff;
            --text: #2c3e50;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg); 
            color: var(--text);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { 
            text-align: center; 
            padding: 30px 20px; 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            border-radius: 15px; 
            margin-bottom: 25px;
            color: white;
        }
        .search-box { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .search-box input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--secondary); 
            border-radius: 8px; 
            font-size: 16px;
        }
        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 25px; 
        }
        @media (min-width: 1024px) { 
            .main-grid { grid-template-columns: 350px 1fr; } 
        }
        .nav-panel { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-height: 80vh;
            overflow-y: auto;
        }
        .tree-header { 
            padding: 10px 12px; 
            background: var(--bg); 
            border-radius: 8px; 
            cursor: pointer; 
            margin: 5px 0;
            border-left: 3px solid transparent;
        }
        .tree-header:hover { 
            background: #f0ebe3; 
            border-left-color: var(--secondary);
        }
        .tree-children { 
            display: none; 
            margin-left: 15px; 
            padding-left: 10px; 
            border-left: 2px solid var(--accent);
        }
        .tree-children.show { display: block; }
        .tree-point { 
            padding: 8px 12px; 
            margin: 3px 0; 
            background: white; 
            border-radius: 6px; 
            cursor: pointer; 
            border: 1px solid #e8e4dc;
            display: flex;
            justify-content: space-between;
        }
        .tree-point:hover { 
            background: var(--secondary); 
            color: white;
        }
        .tree-point.active { 
            background: var(--primary); 
            color: white;
        }
        .viewer-panel { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            min-height: 600px;
        }
        .image-display { 
            max-width: 100%; 
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        .nav-buttons { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin-top: 25px;
        }
        .btn { 
            padding: 10px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary { 
            background: var(--primary); 
            color: white;
        }
        .btn-secondary { 
            background: white; 
            color: var(--primary); 
            border: 2px solid var(--secondary);
        }
    </style>
</head>

        function generateIndex() {
            const treeNav = document.getElementById('treeNav');
            let html = '';
            
            indexData.forEach(item => {
                if (item.points) {
                    html += `<div class="tree-header" onclick="toggleTree(this)">
                        <span>${item.title} (${item.points.length} pts)</span>
                        <span>▼</span>
                    </div>`;
                    html += `<div class="tree-children">`;
                    item.points.forEach(point => {
                        const img = pageToImage(point.page);
                        const hasImage = img !== null;
                        html += `<div class="tree-point" onclick="loadPage(${point.page}, '${point.name}', ${hasImage})">
                            <span>${point.name}</span>
                            <span style="color: #8b9aa8; font-size: 0.85em;">pág. ${point.page}${hasImage ? ` (img ${img})` : ''}</span>
                        </div>`;
                    });
                    html += `</div>`;
                } else {
                    const img = pageToImage(item.page);
                    const hasImage = img !== null;
                    html += `<div class="tree-point" onclick="loadPage(${item.page}, '${item.title}', ${hasImage})">
                        <span>${item.title}</span>
                        <span style="color: #8b9aa8; font-size: 0.85em;">pág. ${item.page}${hasImage ? ` (img ${img})` : ' (SALTO)'}</span>
                    </div>`;
                }
            });
            
            treeNav.innerHTML = html;
        }

        function toggleTree(element) {
            const children = element.nextElementSibling;
            if (children && children.classList.contains('tree-children')) {
                children.classList.toggle('show');
                element.classList.toggle('active');
            }
        }

        function loadPage(pageNum, title, hasImage) {
            const viewerContent = document.getElementById('viewerContent');
            
            if (!hasImage) {
                viewerContent.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2>📄 ${title}</h2>
                        <p style="margin-top: 20px; color: #8b9aa8;">Página ${pageNum} - Sin imagen asociada</p>
                    </div>
                `;
                return;
            }
            
            const imageNum = pageToImage(pageNum);
            const paddedNum = String(imageNum).padStart(4, '0');
            const imageUrl = GITHUB_BASE + paddedNum + '.jpg';
            
            viewerContent.innerHTML = '<div style="text-align: center; padding: 50px;">Cargando imagen...</div>';
            
            const img = new Image();
            img.onload = function() {
                viewerContent.innerHTML = `
                    <div style="text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #e8d4a0;">
                        <h2>📖 ${title}</h2>
                        <div style="background: #faf8f3; padding: 10px 20px; border-radius: 8px; display: inline-block; margin-top: 10px;">
                            <strong>Imagen:</strong> ${paddedNum}.jpg | <strong>Página:</strong> ${pageNum}
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <img src="${imageUrl}" alt="Página ${pageNum}" class="image-display">
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" onclick="previousImage()">⬅️ Anterior</button>
                        <button class="btn btn-primary" onclick="nextImage()">Siguiente ➡️</button>
                    </div>
                `;
                currentPageNum = pageNum;
                currentImageNum = imageNum;
            };
            img.onerror = function() {
                viewerContent.innerHTML = `
                    <div style="background: #fff5f5; color: #c53030; padding: 20px; border-radius: 8px; text-align: center;">
                        <h3>Error al cargar</h3>
                        <p>No se pudo cargar la imagen ${paddedNum}.jpg</p>
                        <p style="margin-top: 10px; font-size: 0.9em;">Verifica tu conexión a internet</p>
                    </div>
                `;
            };
            img.src = imageUrl;
        }

        function previousImage() {
            if (currentImageNum > 1) {
                currentImageNum--;
                currentPageNum--;
                while (saltos.has(currentPageNum) && currentPageNum > 1) {
                    currentPageNum--;
                }
                loadPage(currentPageNum, 'Navegación', true);
            }
        }

        function nextImage() {
            if (currentImageNum < 711) {
                currentImageNum++;
                currentPageNum++;
                while (saltos.has(currentPageNum) && currentPageNum < 732) {
                    currentPageNum++;
                }
                loadPage(currentPageNum, 'Navegación', true);
            }
        }

        // Búsqueda
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('.tree-point').forEach(point => {
                const text = point.textContent.toLowerCase();
                point.style.display = text.includes(query) ? 'flex' : 'none';
            });
        });

        // Inicializar
        generateIndex();
    </script>
